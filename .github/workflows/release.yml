name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  test:
    name: Verify source
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go test ./...
      - run: go vet ./...

  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build Rove Code
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
          VERSION: ${{ github.ref_name }}
        run: |
          OUTNAME="rovecode-${{ matrix.goos }}-${{ matrix.goarch }}"
          if [ "${{ matrix.goos }}" = "windows" ]; then
            OUTNAME="${OUTNAME}.exe"
          fi
          go build -trimpath -ldflags="-s -w -X main.version=${VERSION}" \
            -o "$OUTNAME" ./cmd/sextant/
          echo "Built: $OUTNAME"

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: rovecode-${{ matrix.goos }}-${{ matrix.goarch }}
          path: rovecode-${{ matrix.goos }}-${{ matrix.goarch }}*
          if-no-files-found: error

  release:
    name: Publish GitHub release
    needs: [test, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download binaries
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate checksums
        working-directory: dist
        run: sha256sum rovecode-* > SHA256SUMS

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "Rove Code ${{ github.ref_name }}"
          generate_release_notes: true
          body: |
            ## Install on macOS or Linux

            ```bash
            curl -fsSL https://raw.githubusercontent.com/Kayra-ML/Rove_cli/main/install.sh | sh
            ```

            ```bash
            rovecode              # terminal
            rovecode desktop      # desktop app
            rovecode daemon       # shared daemon
            ```

            The installer verifies the binary against `SHA256SUMS`. Desktop is a separate macOS app (`./build-mac.sh` → Applications → `rovecode desktop`).

            | Platform | Asset |
            |---|---|
            | macOS Apple Silicon | `rovecode-darwin-arm64` |
            | macOS Intel | `rovecode-darwin-amd64` |
            | Linux x64 | `rovecode-linux-amd64` |
            | Linux ARM64 | `rovecode-linux-arm64` |
            | Windows x64 | `rovecode-windows-amd64.exe` |
          files: dist/*
          draft: false
          prerelease: false
