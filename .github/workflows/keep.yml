name: keep

on:
  schedule:
    - cron: "23 08 * * *"
    - cron: "49 15 * * *"
    - cron: "07 21 * * *"
  workflow_dispatch:

jobs:
  commit:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GIT_AUTHOR_NAME: Kayra-ML
      GIT_AUTHOR_EMAIL: "190097445+Kayra-ML@users.noreply.github.com"
      GIT_COMMITTER_NAME: Kayra-ML
      GIT_COMMITTER_EMAIL: "190097445+Kayra-ML@users.noreply.github.com"
      TOPIC: "cli"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Stamp
        run: |
          python3 - << 'PY'
          import random,os,datetime,pathlib,hashlib,sys
          topic=os.environ.get("TOPIC","generic")
          seed=os.environ.get("GITHUB_RUN_ID","")+os.environ.get("GITHUB_SHA","")+str(datetime.datetime.utcnow())
          rng=random.Random(int(hashlib.sha256(seed.encode()).hexdigest(),16)%(2**31))
          if rng.random()<0.20:
              print("skip"); sys.exit(0)
          data={"second-brain": {"verbs": ["extend", "trim", "reword", "clarify", "update", "add example to", "reformat", "annotate"], "nouns": ["capture notes", "weekly review", "inbox", "reference index", "idea scratch", "meeting log", "reading list", "daily note"], "files": ["inbox.md", "review.md", "capture.md", "reference.md", "ideas.md", "meetings.md", "reading.md", "daily.md"]}, "rovecode": {"verbs": ["fix", "refactor", "update", "clean up", "document", "add test for", "tweak", "rewrite"], "nouns": ["auth module", "router", "db connector", "config parser", "logger", "event bus", "api handler", "cache layer"], "files": ["src/auth.py", "src/router.py", "src/db.py", "src/config.py", "src/logger.py", "src/events.py", "src/api.py", "src/cache.py"]}, "rove-studio": {"verbs": ["update", "add", "fix", "tweak", "rework", "clean", "extend", "patch"], "nouns": ["asset pipeline", "shader", "canvas renderer", "timeline", "export preset", "plugin loader", "theme config", "toolbar"], "files": ["studio/pipeline.ts", "studio/shader.ts", "studio/canvas.ts", "studio/timeline.ts", "studio/export.ts", "studio/plugin.ts", "studio/theme.ts", "studio/toolbar.ts"]}, "codemap": {"verbs": ["update", "index", "reparse", "annotate", "trim", "add", "fix", "sync"], "nouns": ["symbol index", "call graph", "import map", "type index", "lint config", "ignore rules", "snapshot", "dependency list"], "files": ["index/symbols.json", "index/calls.json", "index/imports.json", "index/types.json", ".lintrc", "ignore.txt", "snapshot.json", "deps.txt"]}, "cli": {"verbs": ["add", "fix", "update", "document", "refactor", "test", "tweak", "clean"], "nouns": ["install command", "run command", "build flag", "help text", "config loader", "shell completion", "man page", "release script"], "files": ["cmd/install.go", "cmd/run.go", "cmd/build.go", "cmd/help.go", "internal/config.go", "completions/zsh.sh", "docs/man.1", "scripts/release.sh"]}, "community": {"verbs": ["add", "update", "fix", "rewrite", "extend", "correct", "improve", "archive"], "nouns": ["contributing guide", "code of conduct", "issue template", "PR template", "readme", "changelog", "roadmap", "faq"], "files": ["CONTRIBUTING.md", "CODE_OF_CONDUCT.md", ".github/ISSUE_TEMPLATE/bug.md", ".github/PULL_REQUEST_TEMPLATE.md", "README.md", "CHANGELOG.md", "ROADMAP.md", "FAQ.md"]}, "mapcore": {"verbs": ["update", "fix", "tune", "recalculate", "patch", "extend", "index", "clean"], "nouns": ["tile loader", "geo index", "projection config", "cluster algorithm", "bounds checker", "label renderer", "data cache", "viewport"], "files": ["src/tiles.ts", "src/geo.ts", "src/projection.ts", "src/cluster.ts", "src/bounds.ts", "src/labels.ts", "src/datacache.ts", "src/viewport.ts"]}, "python-utils": {"verbs": ["add", "update", "fix", "test", "document", "refactor", "extend", "clean"], "nouns": ["string helpers", "date utils", "http client", "retry decorator", "config loader", "type guards", "file utils", "logging helpers"], "files": ["pyutils/strings.py", "pyutils/dates.py", "pyutils/http.py", "pyutils/retry.py", "pyutils/config.py", "pyutils/types.py", "pyutils/files.py", "pyutils/logging.py"]}}
          td=data.get(topic,list(data.values())[0])
          verbs,nouns,files=td["verbs"],td["nouns"],td["files"]
          count=rng.choices(range(1,7),[22,20,16,10,6,4])[0]
          for i in range(count):
              f=pathlib.Path(rng.choice(files))
              f.parent.mkdir(parents=True,exist_ok=True)
              f.touch()
              open(f,"a").write(f"<!-- {rng.randrange(100,999)} -->\n")
              msg=f"{rng.choice(verbs)} {rng.choice(nouns)}"
              os.system(f'git add "{f}"')
              os.system(f'git commit -q -m "{msg}"')
              print(f"{i+1}/{count}: {msg}")
          PY
      - name: Push
        run: git push origin main
